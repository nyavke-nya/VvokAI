[template_matching]
powerpoint = [1000, 5, 80, 80]
brawler_menu_heart = [1470, 0, 430, 140]
close_popup = [1740, 140, 140, 100]
lobby_menu = [1790, 20, 75, 65]
brawl_pass_house = [1750, 0, 169, 100]
go_back_arrow = [0, 0, 175, 110]
star_drop = [790, 350, 350, 350]
daily_wins = [270, 310, 290, 120]
trophies_screen = [1545, 915, 365, 168]
exit_match_making = [1600, 925, 295, 135]
prestige_continue = [535, 950, 345, 95]
nano_noodles = [360, 880, 215, 150]
match_result = [20, 10, 650, 200]
# The blue TEAM INVITE bar. The modal is centred, so the title centres on
# x=960; the bar holds that phrase and nothing else, so the box is generous.
team_invite = [740, 200, 440, 170]
# The "Idle Disconnect" heading, left-aligned inside its card. Measured at
# about 240px wide, and the box is nearly twice that on purpose: it is read as
# text, and a title clipped by a tight box is a detector that never fires.
idle_disconnect = [430, 380, 500, 160]
[pixel_counter_crop_area]
super=[1460, 830, 1560, 930]
gadget=[1580, 930, 1700, 1050]
hypercharge=[1350, 940, 1450, 1050]


# Emotes sent during a match, so the account does not look like it is only ever
# shooting. Coordinates are for a 1920x1080 screen and are scaled from there.
#
# `bubble` is the round chat button on the right edge. Pressing it opens a grid;
# `buttons` are the emotes in that grid, and one is chosen at random. The grid's
# own bottom-right cell is the chat button again, so it is deliberately not in
# the list - clicking it would just close the panel.
#
# Set every_seconds = 0 to turn this off.
[emotes]
every_seconds = 20
# How long the grid takes to animate open, before the emote is tapped.
open_delay = 0.35
bubble = [1780, 543]
buttons = [
    [1565, 230], [1700, 230], [1835, 230],
    [1565, 320], [1700, 320], [1835, 320],
    [1565, 425], [1700, 425], [1835, 425],
    [1565, 520], [1700, 520],
]
