# Copy this file to cfg/general_config.toml and fill it in.
#
# The real file is git-ignored on purpose: it holds a Brawl Stars API token and
# your player tag, and this repository is public.

cpu_or_gpu = "auto"
max_ips = "auto"
trophies_multiplier = 1
run_for_minutes = 0
emulator_port = 5037
api_base_url = "default"
brawl_stars_package = "bsd.suitcase.release"
ocr_scale_down_factor = 0.8
used_threads = "auto"
default_trophy_target = 1200
auto_load_queue_on_startup = true
play_order = "in_order"

# Screen capture. The device encodes H.264 itself and an emulator usually has
# no hardware encoder, so this competes with rendering the game - uncapped on a
# 120 FPS emulator the game dropped to ~20 FPS.
capture_fps = 90
capture_max_width = 0
capture_bitrate = 4000000

# ---------------------------------------------------------------------------
# Personal. Leave blank unless you want player statistics in the web interface.
# ---------------------------------------------------------------------------

# Your in-game tag, e.g. "#ABC123".
player_tag = ""

# Brawl Stars API token from https://developer.brawlstars.com
#
# Supercell binds every token to the addresses it was created for. There is no
# setting that turns that off, so a token issued at home stops working the
# moment the ISP hands out a new address, and the API answers with a bare 403.
#
# Two ways to live with that:
#
#   1. When creating the key, set the IP range to 0.0.0.0/0. It then works from
#      anywhere, no credentials are stored and no code is involved. Do this if
#      the portal lets you.
#
#   2. Fill in the two fields below. On a 403 the bot logs in to the developer
#      portal, deletes the key it made last time, issues a new one for the
#      current address and retries - about two seconds, once per address change.
#
# Never commit this file; it is git-ignored for exactly this reason.
brawl_api_token = ""

# Developer-portal login, used ONLY to re-issue the token above when the IP
# changes. Leave blank to disable that - option 1 above needs neither.
#
# A password in a plain text file is a password in a plain text file. It never
# leaves this machine except to developer.brawlstars.com, and it is never
# logged, but if that trade is not acceptable use the 0.0.0.0/0 key instead.
brawl_api_email = ""
brawl_api_password = ""
